<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kirchhoff's Circuit Rules Simulator</title>
    <style>
        :root { --ml-blue: #1e3a8a; --ml-gold: #fbbf24; --bg: #f8fafc; --dark: #0f172a; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; }
        .nav { background: var(--ml-blue); color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--ml-gold);}
        .back-link { color: white; text-decoration: none; border: 1px solid rgba(255,255,255,0.5); padding: 6px 12px; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .back-link:hover { background: rgba(255,255,255,0.2); }
        
        .workspace { flex: 1; max-width: 1450px; margin: 20px auto; width: 100%; display: grid; grid-template-columns: 450px 1fr; gap: 20px; padding: 0 20px; box-sizing: border-box;}
        .panel { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow-y: auto;}
        .panel h3 { margin-top: 0; color: var(--dark); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        
        .control-group { margin-bottom: 15px; }
        .control-group label { display: flex; justify-content: space-between; font-weight: bold; color: #475569; margin-bottom: 5px; font-size: 0.9rem; }
        .control-group input[type="range"] { width: 100%; padding: 5px; cursor: pointer;}
        
        .btn { background: var(--ml-blue); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.2s; width: 100%; margin-top: 10px; box-shadow: 0 4px 0 #1e3a8a;}
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-clear { background: #ef4444; box-shadow: 0 4px 0 #b91c1c;}
        
        /* 万用表表盘 */
        .multimeter { background: #1e293b; color: #22c55e; padding: 15px; border-radius: 8px; border: 4px solid #475569; text-align: center; margin-bottom: 20px; box-shadow: inset 0 0 10px rgba(0,0,0,0.8);}
        .mm-display { font-family: 'Consolas', monospace; font-size: 2.2rem; font-weight: bold; display: block; text-shadow: 0 0 8px #22c55e;}
        .mm-label { color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; font-weight: bold; letter-spacing: 1px;}
        
        /* 测量模式切换按钮 */
        .mode-toggle { display: flex; gap: 10px; margin-top: 10px; }
        .mode-btn { flex: 1; padding: 8px; border: 2px solid #cbd5e1; background: white; border-radius: 6px; font-weight: bold; cursor: pointer; color: #475569; transition: 0.3s;}
        .mode-btn.active { border-color: var(--ml-gold); background: #fef3c7; color: #b45309; }

        /* 动态计算黑板 */
        .calc-board { background: #0f172a; color: #e2e8f0; padding: 15px; border-radius: 8px; font-family: 'Consolas', 'Courier New', monospace; font-size: 0.85rem; line-height: 1.5; margin-top: 15px; border: 3px solid #334155; box-shadow: inset 0 0 15px rgba(0,0,0,0.8);}
        .calc-title { color: #fcd34d; font-weight: bold; border-bottom: 1px dashed #475569; padding-bottom: 5px; margin-bottom: 10px;}
        .math-eq { color: #38bdf8; font-weight: bold; }
        .math-res { color: #22c55e; font-weight: bold; }

        /* 数据记录表 */
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.8rem; text-align: center;}
        .data-table th, .data-table td { border: 1px solid #cbd5e1; padding: 6px; }
        .data-table th { background: #f1f5f9; color: #334155; }
        .data-table tr:nth-child(even) { background: #f8fafc; }

        .visual-container { display: flex; flex-direction: column; gap: 15px; }
        .canvas-box { background: #e2e8f0; border-radius: 12px; border: 4px solid #cbd5e1; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 30px rgba(0,0,0,0.1); height: 100%; min-height: 550px;}
        canvas { width: 100%; height: 100%; cursor: pointer;}
    </style>
</head>
<body>

    <div class="nav">
        <a href="unit2.html" class="back-link">⬅ Back to Unit 2</a>
        <h2 style="margin:0; font-size: 1.2rem;">Lab 6: Kirchhoff's Circuit Rules</h2>
        <span style="font-size: 0.9rem;">Maple Leaf Physics</span>
    </div>

    <div class="workspace">
        <div class="panel">
            <div class="multimeter">
                <span class="mm-label" id="mm-title">Virtual Multimeter</span>
                <span class="mm-display" id="mm-val">0.000</span>
                <div class="mode-toggle">
                    <button class="mode-btn active" id="btn-volts" onclick="setMode('V')">Voltmeter (V)</button>
                    <button class="mode-btn" id="btn-amps" onclick="setMode('A')">Ammeter (A)</button>
                </div>
            </div>

            <h3>1. Circuit Parameters</h3>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                    <div class="control-group">
                        <label>Voltage V&sub1;: <span id="v1-val" style="color:#ef4444;">12 V</span></label>
                        <input type="range" id="v1-slider" min="1" max="24" step="1" value="12" oninput="updateCircuit()">
                    </div>
                    <div class="control-group">
                        <label>Resistor R&sub1;: <span id="r1-val" style="color:#3b82f6;">4 &Omega;</span></label>
                        <input type="range" id="r1-slider" min="1" max="20" step="1" value="4" oninput="updateCircuit()">
                    </div>
                </div>
                <div>
                    <div class="control-group">
                        <label>Voltage V&sub2;: <span id="v2-val" style="color:#ef4444;">9 V</span></label>
                        <input type="range" id="v2-slider" min="1" max="24" step="1" value="9" oninput="updateCircuit()">
                    </div>
                    <div class="control-group">
                        <label>Resistor R&sub2;: <span id="r2-val" style="color:#3b82f6;">2 &Omega;</span></label>
                        <input type="range" id="r2-slider" min="1" max="20" step="1" value="2" oninput="updateCircuit()">
                    </div>
                </div>
            </div>
            
            <div class="control-group" style="margin-top: 5px;">
                <label>Middle Resistor R&sub3;: <span id="r3-val" style="color:#3b82f6;">6 &Omega;</span></label>
                <input type="range" id="r3-slider" min="1" max="20" step="1" value="6" oninput="updateCircuit()">
            </div>

            <h3>2. Linear System Solver</h3>
            <div class="calc-board" id="calc-board">
                </div>

            <h3 style="margin-top: 20px;">3. Data Notebook</h3>
            <button class="btn" onclick="recordData()">Record Solved Currents</button>
            <table class="data-table" id="data-table">
                <tr>
                    <th>V&sub1;, V&sub2;</th>
                    <th>R&sub1;, R&sub2;, R&sub3;</th>
                    <th>I&sub1; (A)</th>
                    <th>I&sub2; (A)</th>
                    <th>I&sub3; (A)</th>
                </tr>
            </table>
            <button class="btn btn-clear" onclick="clearData()">Clear Table</button>
        </div>

        <div class="visual-container">
            <div class="canvas-box">
                <canvas id="circuitCanvas" width="900" height="600"></canvas>
            </div>
        </div>
    </div>

    <script>
        const cvs = document.getElementById('circuitCanvas');
        const ctx = cvs.getContext('2d');
        
        // 电路参数
        let v1 = 12, v2 = 9;
        let r1 = 4, r2 = 2, r3 = 6;
        
        // 计算出的电流
        let i1 = 0, i2 = 0, i3 = 0;

        // 交互状态
        let mmMode = 'V'; // 'V' or 'A'
        let hoveredComp = null; // 鼠标悬停的元件
        let selectedComp = null; // 点击选中的元件进行测量

        // 电路组件坐标数据定义
        const comps = {
            'V1': { x: 150, y: 300, w: 40, h: 60, type: 'source', name: 'Battery 1' },
            'V2': { x: 750, y: 300, w: 40, h: 60, type: 'source', name: 'Battery 2' },
            'R1': { x: 300, y: 150, w: 80, h: 40, type: 'resistor', name: 'Resistor 1' },
            'R2': { x: 600, y: 150, w: 80, h: 40, type: 'resistor', name: 'Resistor 2' },
            'R3': { x: 450, y: 300, w: 40, h: 80, type: 'resistor', name: 'Resistor 3 (Middle)' },
            // 导线分支 (用于测量电流)
            'Branch1': { x: 225, y: 150, w: 60, h: 20, type: 'wire', name: 'Left Branch (I1)' },
            'Branch2': { x: 675, y: 150, w: 60, h: 20, type: 'wire', name: 'Right Branch (I2)' },
            'Branch3': { x: 450, y: 400, w: 20, h: 60, type: 'wire', name: 'Center Branch (I3)' }
        };

        function setMode(mode) {
            mmMode = mode;
            document.getElementById('btn-volts').classList.remove('active');
            document.getElementById('btn-amps').classList.remove('active');
            if(mode === 'V') document.getElementById('btn-volts').classList.add('active');
            else document.getElementById('btn-amps').classList.add('active');
            
            updateMultimeter();
        }

        function updateCircuit() {
            v1 = parseFloat(document.getElementById('v1-slider').value);
            v2 = parseFloat(document.getElementById('v2-slider').value);
            r1 = parseFloat(document.getElementById('r1-slider').value);
            r2 = parseFloat(document.getElementById('r2-slider').value);
            r3 = parseFloat(document.getElementById('r3-slider').value);
            
            document.getElementById('v1-val').innerText = v1 + ' V';
            document.getElementById('v2-val').innerText = v2 + ' V';
            document.getElementById('r1-val').innerText = r1 + ' \u03A9';
            document.getElementById('r2-val').innerText = r2 + ' \u03A9';
            document.getElementById('r3-val').innerText = r3 + ' \u03A9';

            solveKirchhoff();
            updateCalcBoard();
            updateMultimeter();
            drawCircuit();
        }

        function solveKirchhoff() {
            // 使用克莱姆法则解二元一次方程组
            // Loop 1 (Left): V1 - I1*R1 - I3*R3 = 0  =>  I1(R1 + R3) + I2(R3) = V1
            // Loop 2 (Right): V2 - I2*R2 - I3*R3 = 0 =>  I1(R3) + I2(R2 + R3) = V2
            // Node (Top): I1 + I2 = I3

            let A = r1 + r3;
            let B = r3;
            let C = v1;
            
            let D = r3;
            let E = r2 + r3;
            let F = v2;

            let delta = (A * E) - (B * D);
            
            i1 = (C * E - B * F) / delta;
            i2 = (A * F - C * D) / delta;
            i3 = i1 + i2;
        }

        function updateCalcBoard() {
            let board = document.getElementById('calc-board');
            
            board.innerHTML = `
                <div class="calc-title">Linear System Solution</div>
                <div><b>1. Current Node (KCL):</b></div>
                <div class="math-eq" style="margin-bottom: 10px;">I&sub3; = I&sub1; + I&sub2;</div>
                
                <div><b>2. Voltage Loops (KVL):</b></div>
                <div class="math-eq">Loop 1: ${v1} - ${r1}I&sub1; - ${r3}I&sub3; = 0</div>
                <div class="math-eq" style="margin-bottom: 10px;">Loop 2: ${v2} - ${r2}I&sub2; - ${r3}I&sub3; = 0</div>
                
                <div><b>3. Solved Equations:</b></div>
                <div style="margin-bottom: 5px;">${(r1+r3)}I&sub1; + ${r3}I&sub2; = ${v1}</div>
                <div style="margin-bottom: 10px;">${r3}I&sub1; + ${(r2+r3)}I&sub2; = ${v2}</div>
                
                <div class="math-res">I&sub1; = ${i1.toFixed(3)} A</div>
                <div class="math-res">I&sub2; = ${i2.toFixed(3)} A</div>
                <div class="math-res">I&sub3; = ${i3.toFixed(3)} A</div>
            `;
        }

        function updateMultimeter() {
            let display = document.getElementById('mm-val');
            let title = document.getElementById('mm-title');
            
            if(!selectedComp) {
                display.innerText = "---";
                display.style.color = "#64748b";
                title.innerText = "Select a component to measure";
                return;
            }

            display.style.color = "#22c55e"; // bright green
            title.innerText = `Measuring: ${comps[selectedComp].name}`;

            let val = 0;
            let unit = "";

            if(mmMode === 'V') {
                unit = " V";
                // 计算电压降
                if(selectedComp === 'V1') val = v1;
                else if(selectedComp === 'V2') val = v2;
                else if(selectedComp === 'R1') val = Math.abs(i1 * r1);
                else if(selectedComp === 'R2') val = Math.abs(i2 * r2);
                else if(selectedComp === 'R3') val = Math.abs(i3 * r3);
                else {
                    // 测导线电压降为 0
                    val = 0;
                }
            } else {
                unit = " A";
                // 计算电流
                if(selectedComp === 'V1' || selectedComp === 'R1' || selectedComp === 'Branch1') val = i1;
                else if(selectedComp === 'V2' || selectedComp === 'R2' || selectedComp === 'Branch2') val = i2;
                else if(selectedComp === 'R3' || selectedComp === 'Branch3') val = i3;
            }

            display.innerText = val.toFixed(3) + unit;
        }

        function recordData() {
            let table = document.getElementById('data-table');
            let row = table.insertRow(-1);
            row.insertCell(0).innerText = `${v1}V, ${v2}V`;
            row.insertCell(1).innerText = `${r1}, ${r2}, ${r3} \u03A9`;
            row.insertCell(2).innerHTML = `<b>${i1.toFixed(3)}</b>`;
            row.insertCell(3).innerHTML = `<b>${i2.toFixed(3)}</b>`;
            row.insertCell(4).innerHTML = `<b>${i3.toFixed(3)}</b>`;
        }

        function clearData() {
            let table = document.getElementById('data-table');
            while(table.rows.length > 1) { table.deleteRow(1); }
        }

        // --- 鼠标交互事件 ---
        cvs.addEventListener('mousemove', function(e) {
            const rect = cvs.getBoundingClientRect();
            let mx = (e.clientX - rect.left) * (cvs.width / rect.width);
            let my = (e.clientY - rect.top) * (cvs.height / rect.height);
            
            hoveredComp = null;
            for(let key in comps) {
                let c = comps[key];
                if(mx > c.x - c.w/2 && mx < c.x + c.w/2 && my > c.y - c.h/2 && my < c.y + c.h/2) {
                    hoveredComp = key;
                    break;
                }
            }
            drawCircuit();
        });

        cvs.addEventListener('click', function() {
            if(hoveredComp) {
                selectedComp = hoveredComp;
                updateMultimeter();
                drawCircuit();
            } else {
                selectedComp = null;
                updateMultimeter();
                drawCircuit();
            }
        });

        // --- 绘图引擎 ---
        function drawResistor(x, y, isVertical=false) {
            ctx.save(); ctx.translate(x, y);
            if(isVertical) ctx.rotate(Math.PI/2);
            
            ctx.beginPath();
            ctx.moveTo(-30, 0); ctx.lineTo(-20, 0);
            ctx.lineTo(-15, -10); ctx.lineTo(-5, 10);
            ctx.lineTo(5, -10); ctx.lineTo(15, 10);
            ctx.lineTo(20, 0); ctx.lineTo(30, 0);
            ctx.stroke();
            ctx.restore();
        }

        function drawBattery(x, y) {
            ctx.save(); ctx.translate(x, y);
            ctx.beginPath();
            // 长线 (正极) 在上
            ctx.moveTo(-20, -10); ctx.lineTo(20, -10);
            // 短线 (负极) 在下，稍微加粗
            ctx.moveTo(-10, 10); ctx.lineTo(10, 10);
            ctx.stroke();
            
            // + / - 符号
            ctx.font = '14px Arial'; ctx.textAlign='center';
            ctx.fillText("+", 30, -5); ctx.fillText("-", 25, 15);
            ctx.restore();
        }

        function drawCircuit() {
            // 背景
            ctx.fillStyle = '#f1f5f9'; ctx.fillRect(0,0,900,600);

            // 1. 绘制导线网格
            ctx.strokeStyle = '#64748b'; ctx.lineWidth = 3;
            
            // 外圈矩形
            ctx.beginPath(); ctx.moveTo(150, 150); ctx.lineTo(750, 150); ctx.stroke(); // 顶部横线
            ctx.beginPath(); ctx.moveTo(150, 450); ctx.lineTo(750, 450); ctx.stroke(); // 底部横线
            ctx.beginPath(); ctx.moveTo(150, 150); ctx.lineTo(150, 450); ctx.stroke(); // 左竖线
            ctx.beginPath(); ctx.moveTo(750, 150); ctx.lineTo(750, 450); ctx.stroke(); // 右竖线
            ctx.beginPath(); ctx.moveTo(450, 150); ctx.lineTo(450, 450); ctx.stroke(); // 中间竖线

            // 2. 绘制元件
            for(let key in comps) {
                let c = comps[key];
                
                // 如果是悬停或选中状态，画高亮框
                if(key === selectedComp) {
                    ctx.fillStyle = 'rgba(34, 197, 94, 0.3)'; // 绿色选中
                    ctx.fillRect(c.x - c.w/2 - 5, c.y - c.h/2 - 5, c.w + 10, c.h + 10);
                } else if(key === hoveredComp) {
                    ctx.fillStyle = 'rgba(59, 130, 246, 0.2)'; // 蓝色悬停
                    ctx.fillRect(c.x - c.w/2 - 5, c.y - c.h/2 - 5, c.w + 10, c.h + 10);
                }

                // 为了画元件，擦除背后的导线
                if(c.type !== 'wire') {
                    ctx.clearRect(c.x - c.w/2, c.y - c.h/2, c.w, c.h);
                    ctx.fillStyle = '#f1f5f9'; ctx.fillRect(c.x - c.w/2, c.y - c.h/2, c.w, c.h);
                }

                ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 3;
                
                if(c.type === 'source') {
                    drawBattery(c.x, c.y);
                    ctx.fillStyle = '#ef4444'; ctx.font='bold 14px Arial'; ctx.textAlign='center';
                    let vLabel = key === 'V1' ? v1 : v2;
                    ctx.fillText(`${key} (${vLabel}V)`, c.x - 40, c.y + 5);
                } 
                else if(c.type === 'resistor') {
                    let isVert = key === 'R3';
                    drawResistor(c.x, c.y, isVert);
                    ctx.fillStyle = '#3b82f6'; ctx.font='bold 14px Arial'; ctx.textAlign='center';
                    let rLabel = key === 'R1' ? r1 : (key === 'R2' ? r2 : r3);
                    let txtX = isVert ? c.x + 40 : c.x;
                    let txtY = isVert ? c.y + 5 : c.y - 20;
                    ctx.fillText(`${key} (${rLabel}\u03A9)`, txtX, txtY);
                }
            }

            // 3. 绘制节点圆点
            ctx.fillStyle = '#0f172a';
            ctx.beginPath(); ctx.arc(450, 150, 6, 0, Math.PI*2); ctx.fill(); // Top node
            ctx.beginPath(); ctx.arc(450, 450, 6, 0, Math.PI*2); ctx.fill(); // Bottom node

            // 4. 绘制电流方向箭头 (根据计算出的正负号)
            drawCurrentArrow(225, 150, i1, false); // I1 on top left
            drawCurrentArrow(675, 150, i2, true);  // I2 on top right
            drawCurrentArrow(450, 380, i3, false, true); // I3 on center vertical
        }

        function drawCurrentArrow(x, y, current, flipX=false, isVert=false) {
            if(Math.abs(current) < 0.001) return; // 电流为0不画

            let direction = current > 0 ? 1 : -1;
            if(flipX) direction *= -1;

            ctx.save(); ctx.translate(x, y);
            if(isVert) {
                ctx.rotate(Math.PI/2 * direction);
            } else {
                if(direction < 0) ctx.rotate(Math.PI);
            }

            ctx.fillStyle = '#eab308'; // 黄色电流箭头
            ctx.beginPath();
            ctx.moveTo(-10, -5); ctx.lineTo(5, -5); ctx.lineTo(5, -10);
            ctx.lineTo(15, 0); ctx.lineTo(5, 10); ctx.lineTo(5, 5);
            ctx.lineTo(-10, 5); ctx.fill();
            ctx.restore();
            
            // 电流标签
            ctx.fillStyle = '#eab308'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
            let label = "";
            if(x === 225) label = "I1"; else if (x === 675) label = "I2"; else label = "I3";
            ctx.fillText(label, isVert ? x + 25 : x, isVert ? y + 5 : y - 15);
        }

        // 初始化
        updateCircuit();
    </script>
</body>
</html>
