<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Young's Double Slit Simulator</title>
    <style>
        :root { --ml-blue: #1e3a8a; --ml-gold: #fbbf24; --bg: #f8fafc; --dark: #0f172a; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; }
        .nav { background: var(--ml-blue); color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--ml-gold);}
        .back-link { color: white; text-decoration: none; border: 1px solid rgba(255,255,255,0.5); padding: 6px 12px; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .back-link:hover { background: rgba(255,255,255,0.2); }
        
        .workspace { flex: 1; max-width: 1450px; margin: 20px auto; width: 100%; display: grid; grid-template-columns: 420px 1fr; gap: 20px; padding: 0 20px; box-sizing: border-box;}
        .panel { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow-y: auto;}
        .panel h3 { margin-top: 0; color: var(--dark); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        
        .control-group { margin-bottom: 20px; }
        .control-group label { display: flex; justify-content: space-between; font-weight: bold; color: #475569; margin-bottom: 8px; font-size: 0.95rem; }
        .control-group input[type="range"] { width: 100%; padding: 8px; cursor: pointer;}
        
        .btn { background: var(--ml-blue); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.2s; width: 100%; margin-top: 10px;}
        .btn:hover { background: #1e40af; }
        .btn-clear { background: #ef4444; margin-top: 10px;}
        .btn-clear:hover { background: #b91c1c; }

        /* 动态计算黑板 */
        .calc-board { background: #0f172a; color: #e2e8f0; padding: 20px; border-radius: 8px; font-family: 'Consolas', monospace; font-size: 0.9rem; line-height: 1.6; margin-top: 15px; border: 3px solid #334155; box-shadow: inset 0 0 15px rgba(0,0,0,0.8);}
        .calc-title { color: #fcd34d; font-weight: bold; border-bottom: 1px dashed #475569; padding-bottom: 5px; margin-bottom: 10px;}
        .math-res { color: #22c55e; font-weight: bold; font-size: 1.1rem;}
        .wavelength-box { padding: 8px; border-radius: 6px; text-align: center; font-weight: bold; color: white; margin-top: 5px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); letter-spacing: 1px;}

        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; text-align: center;}
        .data-table th, .data-table td { border: 1px solid #cbd5e1; padding: 8px; }
        .data-table th { background: #f1f5f9; color: #334155;}
        .data-table tr:nth-child(even) { background: #f8fafc; }

        .visual-container { display: flex; flex-direction: column; gap: 15px; }
        .canvas-box { background: #0f172a; border-radius: 12px; border: 4px solid #cbd5e1; overflow: hidden; position: relative; box-shadow: inset 0 0 50px rgba(0,0,0,1); height: 100%; min-height: 550px;}
        canvas { width: 100%; height: 100%; }
        
        .axis-label { position: absolute; color: #94a3b8; font-family: monospace; font-size: 0.85rem;}
    </style>
</head>
<body>

    <div class="nav">
        <a href="unit4.html" class="back-link">⬅ Back to Unit 4</a>
        <h2 style="margin:0; font-size: 1.2rem;">Lab 12: Young's Double Slit Interference</h2>
        <span style="font-size: 0.9rem;">Maple Leaf Physics</span>
    </div>

    <div class="workspace">
        <div class="panel">
            <h3>1. Laser & Slit Controls</h3>
            
            <div class="control-group">
                <label>Wavelength (&lambda;): <span id="lambda-val" style="color:#ef4444;">650 nm</span></label>
                <input type="range" id="lambda-slider" min="400" max="700" step="10" value="650" oninput="updatePhysics()">
                <div class="wavelength-box" id="color-preview">LASER COLOR</div>
            </div>

            <div class="control-group">
                <label>Slit Separation (d): <span id="d-val" style="color:#3b82f6;">0.10 mm</span></label>
                <input type="range" id="d-slider" min="0.05" max="0.30" step="0.01" value="0.10" oninput="updatePhysics()">
            </div>

            <div class="control-group">
                <label>Screen Distance (L): <span id="l-val" style="color:#fcd34d;">2.0 m</span></label>
                <input type="range" id="l-slider" min="1.0" max="5.0" step="0.5" value="2.0" oninput="updatePhysics()">
            </div>

            <h3>2. Fringe Spacing Calculation</h3>
            <div class="calc-board" id="calc-board">
                </div>

            <h3 style="margin-top: 20px;">3. Data Notebook</h3>
            <button class="btn" onclick="recordData()">Record Fringes</button>
            <table class="data-table" id="data-table">
                <tr>
                    <th>&lambda; (nm)</th>
                    <th>d (mm)</th>
                    <th>L (m)</th>
                    <th>Spacing &Delta;y (mm)</th>
                </tr>
            </table>
            <button class="btn btn-clear" onclick="clearData()">Clear Table</button>
        </div>

        <div class="visual-container">
            <div class="canvas-box">
                <canvas id="opticsCanvas" width="900" height="600"></canvas>
            </div>
        </div>
    </div>

    <script>
        const cvs = document.getElementById('opticsCanvas');
        const ctx = cvs.getContext('2d');
        
        let lambda_nm = 650;
        let d_mm = 0.10;
        let L_m = 2.0;
        
        let deltaY_mm = 0;
        let rgbColor = "rgb(255, 0, 0)";

        // 波长转换为 RGB 颜色，用于极度真实的激光渲染
        function waveLengthToRGB(wl) {
            let R = 0, G = 0, B = 0;
            if (wl >= 380 && wl < 440) { R = -(wl - 440) / (440 - 380); B = 1.0; }
            else if (wl >= 440 && wl < 490) { G = (wl - 440) / (490 - 440); B = 1.0; }
            else if (wl >= 490 && wl < 510) { G = 1.0; B = -(wl - 510) / (510 - 490); }
            else if (wl >= 510 && wl < 580) { R = (wl - 510) / (580 - 510); G = 1.0; }
            else if (wl >= 580 && wl < 645) { R = 1.0; G = -(wl - 645) / (645 - 580); }
            else if (wl >= 645 && wl <= 780) { R = 1.0; }

            let factor = 1.0;
            if (wl >= 380 && wl < 420) factor = 0.3 + 0.7*(wl - 380) / (420 - 380);
            else if (wl > 700 && wl <= 780) factor = 0.3 + 0.7*(780 - wl) / (780 - 700);

            let r = Math.round(R * factor * 255);
            let g = Math.round(G * factor * 255);
            let b = Math.round(B * factor * 255);
            return { r, g, b, css: `rgb(${r},${g},${b})` };
        }

        function updatePhysics() {
            lambda_nm = parseInt(document.getElementById('lambda-slider').value);
            d_mm = parseFloat(document.getElementById('d-slider').value);
            L_m = parseFloat(document.getElementById('l-slider').value);
            
            document.getElementById('lambda-val').innerText = lambda_nm + " nm";
            document.getElementById('d-val').innerText = d_mm.toFixed(2) + " mm";
            document.getElementById('l-val').innerText = L_m.toFixed(1) + " m";

            // 更新激光颜色
            let colorData = waveLengthToRGB(lambda_nm);
            rgbColor = colorData.css;
            document.getElementById('color-preview').style.background = rgbColor;

            // 核心物理计算: Δy = (λ * L) / d
            // 单位转换: λ(1e-9 m), L(m), d(1e-3 m)
            // Δy_m = (lambda_nm * 1e-9 * L_m) / (d_mm * 1e-3)
            let lambda_m = lambda_nm * 1e-9;
            let d_m = d_mm * 1e-3;
            let deltaY_m = (lambda_m * L_m) / d_m;
            deltaY_mm = deltaY_m * 1000;

            updateCalcBoard();
            drawLab(colorData);
        }

        function updateCalcBoard() {
            let board = document.getElementById('calc-board');
            let lambda_m_str = `${lambda_nm} &times; 10<sup>-9</sup>`;
            let d_m_str = `${d_mm.toFixed(2)} &times; 10<sup>-3</sup>`;

            board.innerHTML = `
                <div class="calc-title">Formula: &Delta;y = (&lambda; &middot; L) / d</div>
                <div style="margin-bottom:8px;"><b>1. Convert to Base Units (m):</b></div>
                <div>&lambda; = ${lambda_m_str} m</div>
                <div>d = ${d_m_str} m</div>
                <div style="margin-top:10px; margin-bottom:8px;"><b>2. Calculate Fringe Spacing:</b></div>
                <div>&Delta;y = (${lambda_m_str} &times; ${L_m.toFixed(1)}) / (${d_m_str})</div>
                <div>&Delta;y = ${(deltaY_mm / 1000).toExponential(2)} m</div>
                <div style="margin-top:10px;">&Delta;y = <span class="math-res">${deltaY_mm.toFixed(2)} mm</span></div>
            `;
        }

        function recordData() {
            let table = document.getElementById('data-table');
            let row = table.insertRow(-1);
            row.insertCell(0).innerText = lambda_nm;
            row.insertCell(1).innerText = d_mm.toFixed(2);
            row.insertCell(2).innerText = L_m.toFixed(1);
            row.insertCell(3).innerHTML = "<b>" + deltaY_mm.toFixed(2) + "</b>";
        }

        function clearData() {
            let table = document.getElementById('data-table');
            while(table.rows.length > 1) { table.deleteRow(1); }
        }

        function drawLab(colorData) {
            ctx.fillStyle = '#050505'; ctx.fillRect(0,0,900,600);

            // ============================================
            // Top Section: Screen Pattern (Interference)
            // ============================================
            ctx.fillStyle = '#1e293b'; ctx.fillRect(50, 30, 800, 150);
            
            // 物理渲染干涉条纹 (Intensity I ∝ cos²(π*d*y / λ*L))
            // 我们设置屏幕宽度 (800px) 代表 100 mm 的真实物理宽度
            let screenRealWidth_mm = 100; 
            let mmToPx = 800 / screenRealWidth_mm; // 1mm = 8px
            
            for(let px = 0; px < 800; px++) {
                // 将像素坐标映射到真实的物理 y 坐标 (以中心为0)
                let y_mm = (px - 400) / mmToPx; 
                
                // 强度公式: I = cos²( π * y / Δy )
                let phase = (Math.PI * y_mm) / deltaY_mm;
                let intensity = Math.pow(Math.cos(phase), 2);
                
                // 衍射包络衰减 (单缝衍射极限) - 让边缘渐渐变暗
                let envelope = Math.exp(-Math.pow(y_mm / 30, 2));
                
                let finalIntensity = intensity * envelope;
                
                ctx.fillStyle = `rgba(${colorData.r}, ${colorData.g}, ${colorData.b}, ${finalIntensity})`;
                ctx.fillRect(50 + px, 30, 1, 150);
            }

            // 绘制屏幕刻度尺 (mm)
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(50, 180); ctx.lineTo(850, 180); ctx.stroke();
            for(let y_mm = -50; y_mm <= 50; y_mm += 10) {
                let px = 450 + y_mm * mmToPx;
                ctx.beginPath(); ctx.moveTo(px, 180); ctx.lineTo(px, 185); ctx.stroke();
                ctx.fillStyle = '#94a3b8'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
                ctx.fillText(y_mm + "mm", px, 198);
            }
            
            // 绘制 Δy 标尺 (Fringe Spacing Indicator)
            if(deltaY_mm > 0) {
                let centerPx = 450;
                let m1Px = 450 + deltaY_mm * mmToPx;
                ctx.strokeStyle = '#fcd34d'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(centerPx, 25); ctx.lineTo(centerPx, 35); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(m1Px, 25); ctx.lineTo(m1Px, 35); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(centerPx, 30); ctx.lineTo(m1Px, 30); ctx.stroke();
                ctx.fillStyle = '#fcd34d'; ctx.font = 'bold 12px Arial';
                ctx.fillText("Δy", (centerPx + m1Px)/2, 20);
            }

            // ============================================
            // Bottom Section: Top-Down Diagram
            // ============================================
            ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'left';
            ctx.fillText("Top-Down View (Not to scale)", 50, 250);

            // 激光源
            ctx.fillStyle = '#334155'; ctx.fillRect(20, 390, 80, 40);
            ctx.fillStyle = 'white'; ctx.font = 'bold 12px Arial'; ctx.fillText("LASER", 40, 415);
            ctx.fillStyle = colorData.css; ctx.fillRect(100, 405, 150, 10);

            // 双缝挡板
            ctx.fillStyle = '#64748b';
            ctx.fillRect(250, 250, 10, 145); // Top
            ctx.fillRect(250, 425, 10, 145); // Bottom
            ctx.fillRect(250, 403, 10, 14);  // Center barrier
            
            ctx.fillStyle = 'white'; ctx.fillText(`d = ${d_mm.toFixed(2)} mm`, 200, 390);

            // 屏幕
            ctx.fillStyle = '#e2e8f0'; ctx.fillRect(820, 250, 10, 320);

            // 绘制光波扩散线 (Huygens' Principle)
            ctx.strokeStyle = `rgba(${colorData.r}, ${colorData.g}, ${colorData.b}, 0.2)`;
            ctx.lineWidth = 1;
            let cx1 = 260, cy1 = 399; // Slit 1
            let cx2 = 260, cy2 = 421; // Slit 2
            
            for(let r = 20; r < 600; r += 20) {
                ctx.beginPath(); ctx.arc(cx1, cy1, r, -Math.PI/2, Math.PI/2); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx2, cy2, r, -Math.PI/2, Math.PI/2); ctx.stroke();
            }

            // 距离 L 标注
            ctx.strokeStyle = '#fcd34d'; ctx.lineWidth = 2; ctx.setLineDash([5,5]);
            ctx.beginPath(); ctx.moveTo(260, 580); ctx.lineTo(820, 580); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#fcd34d'; ctx.textAlign = 'center'; ctx.fillText(`Screen Distance L = ${L_m.toFixed(1)} m`, 540, 570);
        }

        updatePhysics();
    </script>
</body>
</html>
